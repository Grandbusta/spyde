name: Deploy docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "editor/**", "src/**", "package.json", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # lastUpdated reads git history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
            editor/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs
      # The editor runs the library's browser build, so build the library first,
      # then place the editor's static files at /editor on the same site.
      - run: npm ci
      - run: npm ci
        working-directory: editor
      - run: npm run editor:build
      - run: cp -R editor/dist docs/.vitepress/dist/editor
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
